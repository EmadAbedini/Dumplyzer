[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memscope-engine"
version = "0.1.0"
description = "Dumplyzer Python analysis engine (Volatility 3)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "volatility3==2.28.0",
  "pefile==2024.8.26",
  "yara-python==4.5.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["memscope_engine*"]

[tool.setuptools.package-data]
memscope_engine = ["rules/yara/bundled/**/*", "rules/yara/custom_README.txt", "rules/yara/RULES.md"]

[tool.pytest.ini_options]
testpaths = ["../tests/engine"]
