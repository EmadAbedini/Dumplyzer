[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memscope-engine"
version = "0.1.0.dev0"
description = "MemScope Python analysis engine (Volatility 3)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "volatility3==2.28.0",
  "pefile>=2024.8.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
yara = ["yara-python>=4.5.0"]
providers = ["yara-python>=4.5.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["memscope_engine*"]

[tool.pytest.ini_options]
testpaths = ["../tests/engine"]
