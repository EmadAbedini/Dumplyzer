[package]
name = "memscope"
version = "0.1.0"
description = "MemScope — Volatility 3 memory forensics workbench"
authors = ["Emad Abedini"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "memscope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
